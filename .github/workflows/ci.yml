name: Continuous Integration & Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality-gate:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4

      - name: 2. Set up Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 3. Install Dependencies Cleanly
        run: npm ci

      - name: 4. Static Analysis & Linting (Gate 1)
        run: npm run lint

      - name: 5. Execute Mathematical Unit Tests (Gate 2)
        run: npm test

      - name: 6. Compile Production Artifacts (Gate 3)
        run: npm run build
